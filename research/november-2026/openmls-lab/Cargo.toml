[package]
name = "shell-classical-pq-composition"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "AGPL-3.0-only"

[dependencies]
openmls = { version = "=0.9.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_sqlite_storage = "=0.3.0"
rusqlite = { version = "=0.37.0", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
hkdf = "=0.12.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
